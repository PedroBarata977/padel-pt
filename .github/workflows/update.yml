name: Atualizar dados

on:
  schedule:
    - cron: "7 * * * *"   # de hora a hora (MatchScorer: jogos, resultados, live)
  push:
    paths: ["docs/fip.json"]   # o PC enviou dados novos da FIP → atualizar já
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes dos parsers
        run: python -m pytest -q
      - name: MatchScorer (jogos, resultados, live)
        run: python -m collector.main live
      - name: Guardar data.json
        if: always()
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add docs/data.json || true
          git diff --cached --quiet && exit 0
          git commit -m "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
